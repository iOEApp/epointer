# Navigation Links
#   To link a page section, specify the URL as a hash `/#` followed by the `id` of the section.
#   The `weight` parameter defines the order that the links will appear in.
#
#   This site is multilingual, so both the `main` and `footer` menus are declared
#   per language in `config/_default/languages.yaml` (under each language's
#   `menu` key). Keeping them here as well would duplicate every entry, so this
#   file intentionally declares no menu items.
