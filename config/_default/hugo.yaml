# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL.
# Hugo needs an absolute baseURL for sitemap.xml, RSS and the absolute
# canonical / og: / hreflang tags — but this value is NOT baked in permanently.
# Override it per environment without editing this file:
#   hugo --minify -b https://some-other-domain.com/
#   HUGO_BASEURL=https://some-other-domain.com/ hugo --minify
#   hugo --environment staging          (see config/<env>/hugo.yaml)
# Runtime navigation does not depend on it: the "/" language gateway is built
# with relURL, so it works on whatever host serves the build.
baseURL: 'https://epointer.oeapp.com/'

############################
## PAGE OPTIONS
############################

cascade: {}

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: true
# English lives at /en/ too, so "/" is free for the browser-language gateway page.
defaultContentLanguageInSubdir: true
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 90
  webp:
    quality: 90
    hint: picture
  avif:
    quality: 90
    hint: picture
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  author: authors
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    # Tailwind is driven through the npm `@tailwindcss/cli` package; Hugo's default
    # policy only whitelists up to `postcss`, so `tailwindcss` must be added here.
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
sitemap:
  _merge: deep
