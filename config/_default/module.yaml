############################
## HUGO MODULES
## Install or uninstall themes and plugins here.
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  - path: github.com/HugoBlox/kit/modules/integrations/netlify
  - path: github.com/HugoBlox/kit/modules/blox

# Install any Hugo Blox within the `hugo-blox/blox/` folder
mounts:
  - source: hugo-blox/blox/community
    target: layouts/_partials/blox/community/
    files:
      - '**.html'
  - source: hugo-blox/blox/all-access
    target: layouts/_partials/blox/
    files:
      - '**.html'
  - source: hugo-blox/blox
    target: assets/dist/community/blox/
    files:
      - '**.css'

  # Project overrides for individual Hugo Blox client islands.
  # The kit mounts its blox components to the same target; because the project
  # module has the highest priority, any file we place under blox/ wins per-path
  # while the untouched blocks keep coming from the kit.
  #   blox/gallery/component.jsx  -> fixes the slideshow `sizes` hint (blurry shots)
  #   blox/pricing/component.jsx  -> collapses the empty CTA row, aligns dividers
  - source: blox
    target: assets/js/hbx/blocks
    files:
      - '**/*.jsx'

  - source: layouts
    target: layouts
  - source: assets
    target: assets
